<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Quotation Generator</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>
    <div id="loginBox" style="
max-width:350px;
margin:100px auto;
padding:30px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.15);
background:white;
">

    <h2 style="text-align:center;">Quotation Generator</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
        style="width:100%;padding:10px;margin-top:20px;"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
        style="width:100%;padding:10px;margin-top:10px;"
    >

    <button
        id="loginBtn"
        style="width:100%;padding:12px;margin-top:20px;"
    >
        Login
    </button>
    
    <div>
        email - demo@quot.com
        pass - demo123
    </div>

</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA99TW8GEv_GnDU4ub2k1WwTUjvo_gejIg",
  authDomain: "quotation-saas-d03b0.firebaseapp.com",
  projectId: "quotation-saas-d03b0",
  storageBucket: "quotation-saas-d03b0.firebasestorage.app",
  messagingSenderId: "447434004275",
  appId: "1:447434004275:web:ce709f8e9870052d031046"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
document.getElementById("loginBtn").addEventListener("click", () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
        .then(() => {
            window.location.href = "app.html";
        })
        .catch((error) => {
            alert(error.message);
        });

});

console.log("Firebase Connected");
</script>
</body>
</html>
